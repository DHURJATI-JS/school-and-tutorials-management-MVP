{% extends "emails/base.html" %}
{% block content %}
<p>Hi {{ name }},</p>
<p>A new <strong>{{ kind|lower }}</strong> has been assigned in <strong>{{ batch }}</strong>:</p>
<div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:14px 16px;margin:10px 0;"><div style="font-size:17px;font-weight:700;">{{ task }}</div>
  <div style="color:#64748b;margin-top:4px;">Deadline: {{ due }}</div></div>
<p style="margin:20px 0;"><a href="{{ link }}" style="background:#4f46e5;color:#fff;padding:11px 18px;border-radius:10px;text-decoration:none;font-weight:700;">Open in your calendar</a></p>
<p>All the best! 🙂</p>
{% endblock %}
