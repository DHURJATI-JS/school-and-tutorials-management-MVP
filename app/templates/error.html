{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block body %}
<div class="cn-lobby" style="background: radial-gradient(circle at 20% 10%, color-mix(in srgb, var(--cn-primary) 25%, transparent), var(--cn-bg) 60%)">
  <div class="cn-card text-center" style="max-width: 520px">
    <div class="cn-empty-icon mx-auto mb-3" style="width:80px;height:80px;border-radius:24px;display:grid;place-items:center;font-size:2rem;background:color-mix(in srgb,var(--cn-primary) 12%,transparent);color:var(--cn-primary)">
      <i class="fa-solid {{ 'fa-lock' if code == 403 else ('fa-compass' if code == 404 else 'fa-triangle-exclamation') }}"></i></div>
    <div class="small-caps">Error {{ code }}</div>
    <h1 class="h2 mt-1">{{ title }}</h1>
    <p class="text-muted">{{ message or "Something didn't go as planned." }}</p>
    <div class="d-flex justify-content-center gap-2 mt-3">
      <a class="btn btn-primary" href="{{ user.home_url if user else '/' }}"><i class="fa-solid fa-house me-2"></i>Go home</a>
      <a class="btn btn-ghost" href="/" data-back>Back</a>
    </div>
  </div>
</div>
{% endblock %}
